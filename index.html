<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Workroom</title>
<style>
  :root{
    --paper:#0b0d12; --panel:#11141c; --panel-2:#161a24; --line:#222836;
    --ink:#e8ebf2; --ink-dim:#8b93a7; --ink-faint:#5b6377;
    --accent:#5ee6a8;        /* the only accent — it marks what is verified */
    --warn:#ffb454; --bad:#ff6b6b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);
       display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:14px;padding:12px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
  header h1{font:600 15px/1 var(--sans);margin:0;letter-spacing:.02em}
  header h1 span{color:var(--ink-faint);font-weight:400}
  .grow{flex:1}
  button{font:500 12px/1 var(--sans);color:var(--ink);background:var(--panel-2);
         border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer}
  button:hover{border-color:#33405a}
  button:active{transform:translateY(1px)}
  button:disabled,input:disabled,select:disabled{cursor:not-allowed;opacity:.48}
  button:disabled:active{transform:none}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06281a;font-weight:650}
  button.ghost{background:transparent}
  input,textarea,select{font:13px/1.4 var(--sans);color:var(--ink);background:var(--panel-2);
         border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
  input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  main{flex:1;display:flex;min-height:0}
  #left{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  #timeline{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px;
            border-top:1px solid var(--line);background:var(--panel)}
  #timeline input[type=range]{flex:1;width:auto;padding:0;background:transparent;border:0;accent-color:var(--accent)}
  #atframe{font:11px/1.4 var(--mono);color:var(--ink-faint);white-space:nowrap;min-width:280px;text-align:right}
  #atframe b{color:var(--ink-dim);font-weight:500}
  #atframe .agent{color:var(--accent)}
  body.past #board{opacity:.86}
  body.past .add,body.past .row{display:none}
  /* watching, not stepping: the card this frame acts on is the one that moves */
  .card{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s,opacity .28s}
  .card.acting{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 30px rgba(94,230,168,.16);
               transform:translateY(-2px) scale(1.015)}
  .card.arriving{animation:land .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes land{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
  .card.leaving{opacity:.25;filter:grayscale(1)}
  #caption{flex:0 0 auto;padding:9px 14px;border-top:1px solid var(--line);background:var(--panel-2);
           font:13px/1.4 var(--sans);color:var(--ink);display:none;align-items:center;gap:9px}
  body.playing #caption{display:flex}
  #caption .verb{font:11px/1 var(--mono);color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase}
  #caption .who{margin-left:auto}
  .frame.at{border-color:var(--accent);background:rgba(94,230,168,.06)}
  @media (prefers-reduced-motion: reduce){
    .card{transition:none} .card.arriving{animation:none}
  }
  .rewound{flex:0 0 auto;padding:8px 14px;background:rgba(255,180,84,.10);
           border-top:1px solid rgba(255,180,84,.35);color:var(--warn);font:12px/1.4 var(--sans)}
    /* minmax(0,…) or the columns refuse to shrink below the move-buttons' width and the
     last lane slides under the ledger */
  /* min-width:0 as well: a grid inside a flex row will not shrink below its content
     without it, so the fourth lane slid under the ledger no matter what the columns said */
  #board{flex:1;min-height:0;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
         gap:12px;padding:14px;overflow:auto}
  .lane{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        display:flex;flex-direction:column;min-height:0}
  .lane.over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .lane h2{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
           color:var(--ink-dim);margin:0;padding:12px 12px 10px;display:flex;gap:8px;align-items:center}
  .lane h2 b{margin-left:auto;font:400 11px/1 var(--mono);color:var(--ink-faint)}
  .cards{flex:1;overflow:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:grab}
  .card:active{cursor:grabbing}
  .card.sel{border-color:var(--accent)}
  .card .t{font-weight:550;margin-bottom:4px;word-break:break-word}
  .card .n{color:var(--ink-dim);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
  .card .meta{margin-top:7px;display:flex;gap:6px;align-items:center;
              font:11px/1 var(--mono);color:var(--ink-faint)}
  .who{background:#1d2432;border:1px solid var(--line);border-radius:20px;padding:3px 7px;color:var(--ink-dim)}
  /* an agent did this, and that is worth being able to see at a glance */
  .who.agent{background:rgba(94,230,168,.10);border-color:rgba(94,230,168,.42);color:var(--accent)}
  .who.agent::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);
                     display:inline-block;margin-right:5px;vertical-align:middle}
  .frame .h b.agent{color:var(--accent)}
  .live{display:flex;align-items:center;gap:6px;font:11px/1 var(--mono);color:var(--ink-faint)}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
  .live.on .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(94,230,168,.16)}
  select.scn{width:auto;padding:7px 9px;font-size:12px}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .row button{padding:5px 8px;font-size:11px}
  .add{margin:0 10px 10px;display:flex;gap:6px}
  .add input{flex:1}

  aside{width:min(392px,32vw);flex:0 0 auto;border-left:1px solid var(--line);background:var(--panel);
        display:flex;flex-direction:column;min-height:0}
  aside .tabs{display:flex;border-bottom:1px solid var(--line)}
  aside .tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:11px 8px;
                     color:var(--ink-dim);border-bottom:2px solid transparent}
  aside .tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
  .pane{flex:1;overflow:auto;padding:12px;display:none}
  .pane.on{display:block}
  .frame{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;background:var(--panel-2)}
  .frame .h{display:flex;gap:8px;align-items:baseline;font:11px/1.3 var(--mono);color:var(--ink-faint)}
  .frame .h b{color:var(--accent);font-weight:600}
  .frame .w{margin-top:5px;font-size:12.5px;color:var(--ink)}
  .frame .k{margin-top:5px;font:10.5px/1.45 var(--mono);color:var(--ink-faint);word-break:break-all}
  .status{border-top:1px solid var(--line);padding:10px 12px;font:11px/1.5 var(--mono);color:var(--ink-faint)}
  .status b{color:var(--ink-dim);font-weight:500}
  .ok{color:var(--accent)} .bad{color:var(--bad)} .warn{color:var(--warn)}
  .note{color:var(--ink-dim);font-size:12.5px;margin:0 0 12px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font:11px/1.5 var(--mono);
      color:var(--ink-faint);word-break:break-all}
  .kv b{color:var(--ink-dim);font-weight:500}
  .empty{color:var(--ink-faint);font-size:12.5px;padding:8px 2px}
  dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);
         border-radius:12px;padding:0;width:min(560px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog .body{padding:16px}
  dialog h3{margin:0 0 10px;font-size:14px}
  dialog textarea{height:190px;font:11.5px/1.5 var(--mono);resize:vertical}
  .card.working{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .card.working .t::after{content:" · working";color:var(--accent);font-weight:600;font-size:11px}
  body.running #dryrun{background:var(--accent);color:#04120b;border-color:var(--accent)}
  .art{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px}
  .art .an{font-weight:600;font-size:12.5px;margin-bottom:3px;word-break:break-all}
  .art .ah{font:10.5px/1.5 var(--mono);color:var(--dim);word-break:break-all}
  .art .aa{display:flex;gap:10px;margin-top:6px}
  .art a{color:var(--accent);font-size:11.5px;text-decoration:none;border-bottom:1px solid transparent}
  .art a:hover{border-bottom-color:var(--accent)}
  .tabs b{color:var(--accent);font-weight:600}
  dialog .foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
           margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
           white-space:nowrap!important;border:0!important}
  #io-error{min-height:1.5em;margin-top:8px}
  @media (max-width:600px){
    html,body{height:auto;min-height:100%;max-width:100%;overflow-x:hidden}
    body{overflow-y:auto}
    header{flex-wrap:wrap;gap:8px;padding:10px}
    header h1{flex:1 0 100%}
    header .grow{display:none}
    header button,header select.scn{max-width:100%;min-width:0}
    main{flex-direction:column;min-height:0;overflow:visible}
    #left{min-height:70vh}
    #board{grid-template-columns:1fr;overflow:visible;padding:10px}
    #timeline{flex-wrap:wrap;gap:8px;padding:10px}
    #timeline input[type=range]{order:3;flex:1 0 100%;width:100%}
    #atframe{order:4;min-width:0;width:100%;white-space:normal;text-align:left}
    aside{width:100%;min-height:55vh;border-left:0;border-top:1px solid var(--line)}
    dialog{max-width:calc(100vw - 20px)}
  }
</style>
</head>
<body>

<header>
  <h1>The Workroom <span>· local, append-only</span></h1>
  <label class="sr-only" for="scenario">Worked example or archived dimension</label>
  <select id="scenario" class="scn" title="Load a worked example. Each is its own stream, so this replaces what is on screen — Export first if you want to keep it."></select>
  <button id="agents" class="ghost" title="Let the agents keep working while you watch">
    <span class="live" id="agents-live"><span class="dot"></span><span id="agents-label">agents idle</span></span>
  </button>
  <button id="dryrun" title="Watch the agents work the board for real, and eject every deliverable out of the browser for review">▶ Dry run</button>
  <button id="verify">Verify the chain</button>

  <div class="grow"></div>
  <button id="export" class="ghost">Export</button>
  <button id="import" class="ghost">Import</button>
  <button id="reset" class="ghost" title="Start a new stream. This does NOT export the old one — use Export first.">Reset</button>
</header>

<main>
  <div id="left">
    <div id="board"></div>
    <div id="caption"></div>
    <div id="timeline">
      <button id="play" title="Replay the world from the first frame">▶ Replay from frame 0</button>
      <input id="scrub" type="range" min="0" value="0" step="1" aria-label="frame">
      <div id="atframe">—</div>
      <button id="now" class="ghost" hidden>Return to now</button>
      <button id="fork" class="ghost" title="Start a new dimension from the frame you are looking at">⑂ Fork from here</button>
    </div>
  </div>
  <aside>
    <div class="tabs" role="tablist" aria-label="Record details">
      <button id="tab-ledger" role="tab" aria-selected="true" aria-controls="pane-ledger" tabindex="0">Ledger</button>
      <button id="tab-about" role="tab" aria-selected="false" aria-controls="pane-about" tabindex="-1">Stream</button>
      <button id="tab-out" role="tab" aria-selected="false" aria-controls="pane-out" tabindex="-1">Outbox <b id="out-n"></b></button>
    </div>
    <div class="pane on" id="pane-ledger" role="tabpanel" aria-labelledby="tab-ledger"></div>
    <div class="pane" id="pane-about" role="tabpanel" aria-labelledby="tab-about" hidden></div>
    <div class="pane" id="pane-out" role="tabpanel" aria-labelledby="tab-out" hidden></div>
    <div class="status" id="status" role="status" aria-live="polite" aria-atomic="true">…</div>
  </aside>
</main>

<dialog id="io" aria-labelledby="io-title" aria-describedby="io-note">
  <div class="body">
    <h3 id="io-title">Export</h3>
    <p class="note" id="io-note"></p>
    <label class="sr-only" for="io-text">Stream JSON</label>
    <textarea id="io-text" spellcheck="false"></textarea>
    <div id="io-error" class="bad" role="alert" aria-live="assertive"></div>
  </div>
  <div class="foot">
    <button id="io-copy" class="ghost">Copy</button>
    <button id="io-ok" class="primary">Close</button>
  </div>
</dialog>

<script>

/* ────────────────────────────────────────────────────────────────────────────

   A board is a convenient way to LOOK at work. It is not the record. The record
   is an append-only chain of rapp/1 frames in this browser's localStorage, and
   the board you see is a projection of it — press "Rebuild from frames" and the
   board is thrown away and replayed from the chain, which is the only reason to
   believe the chain is the truth rather than a log written beside it.

   Conformance (SPEC.md rev-6, kody-w/rapp-1):
     §4  canonicalization — RFC 8785 JCS over the I-JSON domain (no floats)
     §5  H(space, v) = sha256( utf8(space) || 0x0A || canonical(v) )
     §6  the rappid is MINTED ONCE from random bytes — never a hash of a name
     §7  the frame is exactly eleven keys; particle then wave
   Cross-checked against the reference Python implementation by verify_parity.mjs;
   the same payload must produce the same two hashes in both, or this is not
   rapp/1 and the word should not be used.
   ──────────────────────────────────────────────────────────────────────────── */
