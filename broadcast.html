<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workroom Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0b0f0d; --panel:#111714; --line:#1f2a25; --ink:#e6efe9; --dim:#7f9289;
    --accent:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
         background:var(--panel);flex-wrap:wrap}
  h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.2px}
  h1 span{color:var(--dim);font-weight:400}
  .grow{flex:1}
  button{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:7px;border:1px solid var(--line);
         background:#182220;color:var(--ink);cursor:pointer}
  button:hover{border-color:#2e3f37}
  button.ghost{background:transparent}
  button[disabled]{opacity:.4;cursor:default}
  button.hot{background:var(--bad);border-color:var(--bad);color:#1a0505;font-weight:600}
  button.go{background:var(--accent);border-color:var(--accent);color:#04120b;font-weight:600}
  main{display:flex;height:calc(100% - 49px)}
  #stage{flex:1;min-width:0;position:relative;background:#000}
  iframe{width:100%;height:100%;border:0;display:block}
  aside{width:400px;flex:0 0 400px;border-left:1px solid var(--line);background:var(--panel);
        display:flex;flex-direction:column;min-height:0}
  .band{padding:10px 14px;border-bottom:1px solid var(--line)}
  .band h2{margin:0 0 6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .wire{flex:1;overflow:auto;padding:8px 10px;font:11.5px/1.6 var(--mono)}
  .fr{display:flex;gap:8px;padding:4px 6px;border-radius:6px;border-left:2px solid transparent}
  .fr.new{background:#14211a;border-left-color:var(--accent)}
  .fr .sq{color:var(--dim);min-width:26px;text-align:right}
  .fr .ev{min-width:96px}
  .fr .wv{color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fr .wh{color:var(--accent)}
  .stat{padding:8px 14px;border-top:1px solid var(--line);font:11px/1.5 var(--mono);color:var(--dim);
        min-height:34px;word-break:break-word}
  .stat.ok{color:var(--accent)} .stat.bad{color:var(--bad)} .stat.warn{color:var(--warn)}
  .kv{display:grid;grid-template-columns:82px 1fr;gap:2px 10px;font:11px/1.6 var(--mono)}
  .kv div:nth-child(odd){color:var(--dim)}
  .kv div:nth-child(even){word-break:break-all}
  .lnk{display:flex;gap:6px;margin-top:7px}
  .lnk input{flex:1;min-width:0;font:11px var(--mono);background:#0d1411;color:var(--ink);
             border:1px solid var(--line);border-radius:6px;padding:5px 7px}
  .dot{width:7px;height:7px;border-radius:50%;background:#2c3a34;display:inline-block;margin-right:6px}
  .dot.on{background:var(--bad);box-shadow:0 0 0 3px rgba(248,113,113,.18)}
  .dot.live{background:var(--accent);box-shadow:0 0 0 3px rgba(74,222,128,.18)}
  .files a{color:var(--accent);text-decoration:none;font-size:11.5px}
  .files div{font:11px/1.7 var(--mono);color:var(--dim);word-break:break-all}
  /* the watcher board — a second reader of the same wire, not a mirror of pixels */
  #watch{display:none;height:100%;padding:14px;overflow:auto}
  body.watching #stage{display:none} body.watching #watch{display:block}
  body.watching aside{flex:0 0 340px;width:340px}
  .lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;height:100%}
  .ln{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto}
  .ln h3{margin:0 0 8px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .cd{background:#151d1a;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px}
  .cd.fresh{border-color:var(--accent)}
  .cd .t{font-size:12.5px;font-weight:600}
  .cd .n{font-size:11.5px;color:var(--dim);margin-top:2px}
  .cd .w{font:10.5px var(--mono);color:var(--accent);margin-top:4px}
  @media (max-width:900px){ aside{display:none} }
</style>

<header>
  <h1>Workroom Studio <span id="mode">· the board, live</span></h1>
  <button id="run" class="go">▶ Run the board</button>
  <button id="agents" class="ghost">agents</button>
  <button id="rec"><span class="dot" id="recdot"></span><span id="reclabel">Record</span></button>
  <button id="golive" class="ghost"><span class="dot" id="livedot"></span><span id="livelabel">Go live</span></button>
  <div class="grow"></div>
  <a href="./" style="color:var(--dim);font-size:12px;text-decoration:none">open the Workroom on its own →</a>
</header>

<main>
  <div id="stage"><iframe id="f" src="./index.html" title="The Workroom"></iframe></div>
  <div id="watch"><div class="lanes" id="lanes"></div></div>
  <aside>
    <div class="band">
      <h2>The wire</h2>
      <div class="kv" id="meta"></div>
      <div class="lnk" id="linkrow" hidden>
        <input id="link" readonly>
        <button id="copy" class="ghost">Copy</button>
      </div>
    </div>
    <div class="wire" id="wire"></div>
    <div class="band files" id="files" hidden><h2>Saved here</h2></div>
    <div class="stat" id="stat">…</div>
  </aside>
</main>

<script>
/* ── §4 canonicalization ─────────────────────────────────────────────────── */
function canonical(v) {
  if (v === null || typeof v === 'boolean') return JSON.stringify(v);
  if (typeof v === 'number') {
    if (!Number.isInteger(v)) throw new Error('floats are outside this profile; use ints or strings');
    if (!Number.isSafeInteger(v)) throw new Error('int outside the interoperable range; carry it as a string');
    return JSON.stringify(v);
  }
  if (typeof v === 'string') return wellFormed(v);
  if (Array.isArray(v)) return '[' + v.map(canonical).join(',') + ']';
  if (typeof v === 'object') {
    // RFC 8785 orders member names by UTF-16 code units, which is exactly what
    // JavaScript's default string sort does — the one place JS gets JCS for free.
    const keys = Object.keys(v).sort();
    return '{' + keys.map(k => wellFormed(k) + ':' + canonical(v[k])).join(',') + '}';
  }
  throw new Error('non-I-JSON value: ' + typeof v);
}
// §4 refuses an unpaired surrogate rather than repairing it. JS would happily
// escape a lone \uD800 and hash the result, but the reference implementation
// emits the raw character — so the two would disagree on a string no human
// typed and the frame would be unverifiable anywhere else. Refusing is the only
// answer that keeps the hash meaningful.
function wellFormed(s) {
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    if (c >= 0xD800 && c <= 0xDBFF) {
      const n = s.charCodeAt(i + 1);
      if (!(n >= 0xDC00 && n <= 0xDFFF)) throw new Error('unpaired surrogate — outside the I-JSON domain');
      i++;
    } else if (c >= 0xDC00 && c <= 0xDFFF) {
      throw new Error('unpaired surrogate — outside the I-JSON domain');
    }
  }
  return JSON.stringify(s);
}

/* ── §5 domain-separated content addressing ──────────────────────────────── */
const enc = new TextEncoder();
async function sha256Hex(bytes) {
  const d = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function joinBytes(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0); out.set(b, a.length);
  return out;
}
async function H(space, v) {
  return sha256Hex(joinBytes(enc.encode(space + '\n'), enc.encode(canonical(v))));
}
async function Hb(space, bytes) {
  return sha256Hex(joinBytes(enc.encode(space + '\n'), bytes));
}

// The hash the Outbox shows has to be the hash the reader can take. `shasum -a 256`
// hashes the bytes and nothing else, so the artifact hash is a PLAIN sha256 — the
// domain-separated H() is for frames, where the separation is the point, and printing
// one while telling the reader to run the other is telling them to check the wrong thing.
async function sha256Plain(bytes) { return sha256Hex(bytes); }

/* ── §6 identity — minted once, from randomness ──────────────────────────── */
async function mintStream() {
  // §6.2 keyless: the tail is Hb over sixteen random octets. It is NOT derived
  // from "@owner/slug" — a name-hash is the one thing the spec calls a cardinal
  // sin, because two different things with the same name would collide.
  const uuid = crypto.getRandomValues(new Uint8Array(16));
  const tail = await Hb('rapp/1:rappid', uuid);
  const instance = await Hb('rapp/1:rappid', crypto.getRandomValues(new Uint8Array(16)));
  const rappid = `rappid:@${OWNER}/${SLUG}:${tail}`;
  return `${rappid}:${instance.slice(0, 16)}`;      // memory-stream = rappid ":" instance
}

/* ── §7 the frame ────────────────────────────────────────────────────────── */
function utcNow(floor) {
  // exactly YYYY-MM-DDTHH:MM:SS.mmmZ — 24 bytes, three fractional digits
  let u = new Date().toISOString().replace(/\.(\d{3})\d*Z$/, '.$1Z');
  // §7.5 step 4 forbids time running backwards along a chain, and the reader
  // enforced it while the writer did not — so one backward clock step (an NTP
  // correction after sleep, a VM resume) wrote a frame the app then refused
  // forever, with the board blank on every load and no way back but Reset.
  // The comparison is bytewise on this fixed form, which is chronological.
  if (floor && u < floor) u = floor;
  return u;
}
async function buildFrame(streamId, seq, payload, prev, floorUtc) {
  const payload_hash = await H('rapp/1:particle', payload);
  const pre = {
    spec: SPEC, kind: KIND, stream_id: streamId, seq, utc: utcNow(floorUtc),
    payload, payload_hash,
    prev,                     // predecessor's payload_hash (the worldline link)
    prev_wave: null,          // §7.4: null on every memory stream, always
  };
  // the wave pre-image is the frame minus exactly frame_hash and sig
  const frame_hash = await H('rapp/1:wave', pre);
  return { ...pre, frame_hash, sig: null };
}

/* ── state ─────────────────────────────────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
const SPEC = 'rapp/1', KIND = 'memory.save';
const LANES = [['now','Now'],['next','Next'],['blocked','Blocked'],['done','Done']];
const WATCH = (location.hash.match(/^#watch=([A-Za-z0-9_-]{1,64})$/) || [])[1] || null;

let wireFrames = [];        // what has come over the wire, in order
let wireStream = null;
let lastGood = null;        // the last frame we accepted, for linkage
let watchers = new Map();   // peer id -> connection (studio side)
let peer = null, recorder = null, chunks = [], recStream = null, recStart = 0;

const stat = (m, cls) => { const e = $('stat'); e.textContent = m; e.className = 'stat ' + (cls || ''); };

/* ── the wire ──────────────────────────────────────────────────────────────── */
// Everything that arrives is verified before it is believed, including frames from
// the iframe sitting next to us. "It came from our own page" is not a reason to skip
// the check — the check is the whole reason the record is worth watching.
async function frameIsGood(f, expectStream, prev) {
  if (!f || typeof f !== 'object' || Array.isArray(f)) return 'not a frame';
  const keys = Object.keys(f).sort().join(',');
  if (keys !== 'frame_hash,kind,payload,payload_hash,prev,prev_wave,seq,sig,spec,stream_id,utc') return 'key set is not the eleven';
  if (f.spec !== SPEC) return 'not ' + SPEC;
  if (f.kind !== KIND) return 'kind is not ' + KIND;
  if (expectStream && f.stream_id !== expectStream) return 'a different stream';
  if (!Number.isSafeInteger(f.seq) || f.seq < 0) return 'seq is not a uint53';
  if (prev && f.seq !== prev.seq + 1) return 'seq ' + f.seq + ' does not follow ' + prev.seq;
  if (!prev && f.seq !== 0) return 'the first frame we see must be a genesis';
  if (f.prev !== (prev ? prev.payload_hash : null)) return 'prev does not link to the frame before it';
  if (f.prev_wave !== null) return 'prev_wave must be null on a memory stream';
  if (f.sig !== null) return 'sig must be null';
  if (prev && typeof f.utc === 'string' && f.utc < prev.utc) return 'time runs backwards';
  let ph, fh;
  try {
    ph = await H('rapp/1:particle', f.payload);
    const pre = { ...f }; delete pre.frame_hash; delete pre.sig;
    fh = await H('rapp/1:wave', pre);
  } catch (e) { return 'could not be canonicalized — ' + e.message; }
  if (ph !== f.payload_hash) return 'payload_hash does not match the payload';
  if (fh !== f.frame_hash) return 'frame_hash does not match the frame';
  return null;
}

// Accept one frame onto the wire. Returns true if it landed.
async function takeFrame(f, streamId) {
  if (wireStream && streamId && streamId !== wireStream) {
    // the board switched to another stream: start the wire again rather than
    // splicing two chains into one and calling the result a record
    wireFrames = []; lastGood = null; wireStream = streamId; $('wire').innerHTML = '';
  }
  const why = await frameIsGood(f, wireStream, lastGood);
  if (why) { stat('refused a frame: ' + why, 'bad'); return false; }
  if (!wireStream) wireStream = f.stream_id;
  wireFrames.push(f); lastGood = f;
  paintFrame(f);
  paintMeta();
  return true;
}

const EVENT_NAME = { 'room.opened':'room opened', 'card.added':'card added',
                     'card.moved':'card moved', 'card.edited':'card edited', 'card.removed':'card removed' };

function paintFrame(f) {
  const w = $('wire');
  const row = document.createElement('div');
  row.className = 'fr new';
  const p = f.payload || {};
  const who = p.who ? ' ' + p.who : '';
  row.innerHTML = '<span class="sq">' + f.seq + '</span>'
                + '<span class="ev">' + (EVENT_NAME[p.event] || '?') + '</span>'
                + '<span class="wv">' + esc((p.title || p.titleAt || '') + who) + '</span>'
                + '<span class="wh">' + f.frame_hash.slice(0, 8) + '</span>';
  w.append(row);
  w.scrollTop = w.scrollHeight;
  setTimeout(() => row.classList.remove('new'), 1400);
  while (w.children.length > 400) w.removeChild(w.firstChild);
}
function esc(x) { return String(x == null ? '' : x).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]); }

function paintMeta() {
  const head = wireFrames[wireFrames.length - 1];
  const rows = [
    ['spec', SPEC + ' (rev-6)'],
    ['stream', wireStream || '—'],
    ['frames', String(wireFrames.length)],
    ['head wave', head ? head.frame_hash : '—'],
    ['watchers', WATCH ? 'watching' : String(watchers.size)],
  ];
  $('meta').innerHTML = rows.map(([k, v]) => '<div>' + k + '</div><div>' + esc(v) + '</div>').join('');
}

/* ── the studio: the board runs next door and every frame it commits comes here ── */
if (!WATCH) {
  window.addEventListener('message', async (e) => {
    if (e.source !== $('f').contentWindow) return;         // only the board we are holding
    const m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.rapp === 'frame') {
      if (await takeFrame(m.frame, m.stream_id)) relay({ rapp: 'frame', stream_id: m.stream_id, frame: m.frame });
      return;
    }
    if (m.rapp === 'chain' && Array.isArray(m.frames)) {
      wireFrames = []; lastGood = null; wireStream = null; $('wire').innerHTML = '';
      for (const f of m.frames) if (!(await takeFrame(f, m.stream_id))) break;
      relay({ rapp: 'chain', stream_id: wireStream, frames: wireFrames });
      stat(wireFrames.length + ' frames on the wire, every one verified here', 'ok');
      return;
    }
    if (m.rapp === 'state') {
      if (m.what === 'scenario' || m.what === 'fork') ask('chain');
      if (m.what === 'run-ended') stat('the run finished — ' + wireFrames.length + ' frames on the wire', 'ok');
      return;
    }
  });
  const ask = (what) => { try { $('f').contentWindow.postMessage({ rapp: 'command', do: what }, '*'); } catch (e) {} };
  $('f').addEventListener('load', () => setTimeout(() => ask('chain'), 400));
  $('run').onclick = () => { ask('run'); stat('the board is working — every frame it commits lands on the wire'); };
  $('agents').onclick = () => ask('agents');
}

/* ── going live: the frames, not the pixels ────────────────────────────────── */
// A watcher does not receive a picture of the board. It receives the FRAMES and
// re-derives the board itself, verifying each one — so what is shared is the record,
// and the watcher's copy is as good as the original rather than a video of it.
function relay(msg) {
  for (const [, c] of watchers) { try { c.send(msg); } catch (e) {} }
}

function goLive() {
  if (peer) {
    peer.destroy(); peer = null; watchers.clear();
    $('livedot').className = 'dot'; $('livelabel').textContent = 'Go live';
    $('linkrow').hidden = true; paintMeta(); stat('off the air'); return;
  }
  stat('opening a channel…');
  peer = new Peer();
  peer.on('open', (id) => {
    const url = location.href.split('#')[0] + '#watch=' + id;
    $('link').value = url; $('linkrow').hidden = false;
    $('livedot').className = 'dot live';
    $('livelabel').textContent = 'On the air';
    stat('live — anyone with that link watches the frames arrive, in their own browser', 'ok');
  });
  peer.on('connection', (c) => {
    c.on('open', () => {
      watchers.set(c.peer, c); paintMeta();
      try { c.send({ rapp: 'chain', stream_id: wireStream, frames: wireFrames }); } catch (e) {}
      stat(watchers.size + ' watching', 'ok');
    });
    c.on('close', () => { watchers.delete(c.peer); paintMeta(); });
    c.on('error', () => { watchers.delete(c.peer); paintMeta(); });
  });
  peer.on('error', (e) => stat('the channel would not open — ' + e.type, 'bad'));
}

/* ── watching ──────────────────────────────────────────────────────────────── */
if (WATCH) {
  document.body.classList.add('watching');
  $('mode').textContent = '· watching a live board';
  for (const b of ['run', 'agents', 'golive']) $(b).remove();
  stat('connecting…');
  const p = new Peer();
  p.on('open', () => {
    const c = p.connect(WATCH, { serialization: 'json' });
    c.on('open', () => stat('connected — waiting for the record'));
    c.on('data', async (m) => {
      if (!m || typeof m !== 'object') return;
      if (m.rapp === 'chain' && Array.isArray(m.frames)) {
        wireFrames = []; lastGood = null; wireStream = null; $('wire').innerHTML = '';
        let ok = 0;
        for (const f of m.frames) { if (await takeFrame(f, m.stream_id)) ok++; else break; }
        stat(ok + ' frames received and verified here — the board below was rebuilt from them', 'ok');
        paintBoard();
        return;
      }
      if (m.rapp === 'frame') {
        if (await takeFrame(m.frame, m.stream_id)) { paintBoard(m.frame); stat('live', 'ok'); }
        return;
      }
    });
    c.on('close', () => stat('the broadcast ended', 'warn'));
    c.on('error', (e) => stat('lost the connection — ' + (e && e.type || 'unknown'), 'bad'));
  });
  p.on('error', (e) => stat('could not join — ' + e.type, 'bad'));
}

// The watcher's own projection. Not a mirror of the studio's DOM: the same rules
// applied to the same frames, which is the claim being demonstrated.
function project(list) {
  const b = { cards: {}, order: {} };
  for (const [id] of LANES) b.order[id] = [];
  for (const f of list) {
    const p = f.payload, id = p.card;
    if (p.event === 'card.added') {
      if (!b.order[p.lane]) continue;
      b.cards[id] = { id, title: p.title, note: p.note || '', who: p.who || '', lane: p.lane };
      b.order[p.lane].push(id);
    } else if (p.event === 'card.moved') {
      const c = b.cards[id]; if (!c || !b.order[p.lane]) continue;
      b.order[c.lane] = b.order[c.lane].filter(x => x !== id);
      c.lane = p.lane; b.order[p.lane].push(id);
    } else if (p.event === 'card.edited') {
      const c = b.cards[id]; if (!c) continue;
      if ('title' in p) c.title = p.title;
      if ('note' in p) c.note = p.note;
      if ('who' in p) c.who = p.who;
    } else if (p.event === 'card.removed') {
      const c = b.cards[id]; if (!c) continue;
      b.order[c.lane] = b.order[c.lane].filter(x => x !== id);
      delete b.cards[id];
    }
  }
  return b;
}

function paintBoard(justArrived) {
  const b = project(wireFrames);
  const touched = justArrived && justArrived.payload && justArrived.payload.card;
  const el = $('lanes'); el.innerHTML = '';
  for (const [id, name] of LANES) {
    const d = document.createElement('div'); d.className = 'ln';
    const h = document.createElement('h3'); h.textContent = name + ' · ' + (b.order[id] || []).length; d.append(h);
    for (const cid of (b.order[id] || [])) {
      const c = b.cards[cid]; if (!c) continue;
      const cd = document.createElement('div'); cd.className = 'cd' + (cid === touched ? ' fresh' : '');
      const t = document.createElement('div'); t.className = 't'; t.textContent = c.title; cd.append(t);
      if (c.note) { const nn = document.createElement('div'); nn.className = 'n'; nn.textContent = c.note; cd.append(nn); }
      if (c.who) { const w = document.createElement('div'); w.className = 'w'; w.textContent = c.who; cd.append(w); }
      d.append(cd);
    }
    el.append(d);
  }
}

/* ── recording ─────────────────────────────────────────────────────────────── */
// The browser will not hand a page a picture of itself without the person saying so,
// which is right — so this asks, and the picker is the consent. What comes back is
// recorded to webm and written to disk when you stop. Nothing is uploaded anywhere.
async function toggleRecord() {
  if (recorder) { stopRecording(); return; }
  if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    stat('this browser will not record a tab — Chrome or Edge will', 'bad'); return;
  }
  let s;
  try {
    s = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: 'browser', frameRate: 30 }, audio: false, preferCurrentTab: true,
    });
  } catch (e) { stat('recording was not started — ' + (e.name === 'NotAllowedError' ? 'you cancelled the picker' : e.message), 'warn'); return; }
  recStream = s;
  const type = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
  chunks = [];
  try { recorder = new MediaRecorder(s, type ? { mimeType: type, videoBitsPerSecond: 4_000_000 } : {}); }
  catch (e) { stat('could not start the recorder — ' + e.message, 'bad'); s.getTracks().forEach(t => t.stop()); return; }
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = saveRecording;
  // If the person stops the share from the browser's own bar, that IS the stop.
  s.getVideoTracks().forEach(t => t.addEventListener('ended', () => { if (recorder) stopRecording(); }));
  recorder.start(1000);
  recStart = Date.now();
  $('recdot').className = 'dot on';
  $('reclabel').textContent = 'Stop and save';
  $('rec').classList.add('hot');
  stat('recording — press again to stop and write the file', 'warn');
}

function stopRecording() {
  try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch (e) {}
  try { if (recStream) recStream.getTracks().forEach(t => t.stop()); } catch (e) {}
  recStream = null;
}

async function saveRecording() {
  const secs = Math.max(1, Math.round((Date.now() - recStart) / 1000));
  const blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || 'video/webm' });
  recorder = null; chunks = [];
  $('recdot').className = 'dot'; $('reclabel').textContent = 'Record'; $('rec').classList.remove('hot');
  if (!blob.size) { stat('the recorder produced nothing — nothing was saved', 'bad'); return; }

  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const name = 'workroom-session-' + stamp + '.webm';
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
  document.body.append(a); a.click(); a.remove();

  // The record that goes with the film: the exact frames that were on the wire while
  // it was rolling, so the video can be checked against something rather than believed.
  // plain sha256 over the file's own bytes, so `shasum -a 256` on what you saved agrees
  const sha = await sha256Hex(new Uint8Array(await blob.arrayBuffer()));
  const side = JSON.stringify({
    recording: name, seconds: secs, bytes: blob.size, sha256: sha,
    stream_id: wireStream, frames: wireFrames,
  }, null, 2);
  const surl = URL.createObjectURL(new Blob([side], { type: 'application/json' }));
  const b2 = document.createElement('a'); b2.href = surl; b2.download = name.replace(/\.webm$/, '.frames.json');
  document.body.append(b2); b2.click(); b2.remove();

  const box = $('files'); box.hidden = false;
  const row = document.createElement('div');
  row.innerHTML = '<a href="' + url + '" download="' + name + '">' + name + '</a><div>'
                + secs + 's · ' + (blob.size / 1048576).toFixed(1) + ' MB · sha256 ' + sha + '</div>';
  box.append(row);
  stat('saved ' + name + ' (' + secs + 's) and the frames beside it', 'ok');
}

$('rec').onclick = () => toggleRecord();
if (!WATCH) $('golive').onclick = () => goLive();
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('link').value); $('copy').textContent = 'Copied';
        setTimeout(() => $('copy').textContent = 'Copy', 1200); }
  catch (e) { $('link').select(); }
};
window.addEventListener('beforeunload', () => { stopRecording(); if (peer) peer.destroy(); });

paintMeta();
if (WATCH) paintBoard();
else stat('the board is running next door — press "Run the board" and watch the frames arrive');
</script>
